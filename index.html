<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tdstud1o · 工具箱</title>
    <style>
      :root { --card-bg: rgba(255,255,255,.92); --card-border: rgba(255,255,255,.45); --primary:#4f46e5; --text:#1f2430; --secondary:#6b7280; --shadow:0 8px 28px rgba(0,0,0,.14); }
      @media (prefers-color-scheme: dark) { :root { --card-bg: rgba(29,30,32,.84); --card-border: rgba(255,255,255,.1); --primary:#818cf8; --text:#e5e7eb; --secondary:#9ca3af; --shadow:0 8px 28px rgba(0,0,0,.5); } }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); line-height:1.6; background: radial-gradient(38rem 38rem at 12% -8%, rgba(99,102,241,.16), transparent 60%), radial-gradient(32rem 32rem at 88% 12%, rgba(168,85,247,.13), transparent 60%), #f6f7fb; }
      @media (prefers-color-scheme: dark) { body { background: radial-gradient(38rem 38rem at 12% -8%, rgba(99,102,241,.2), transparent 60%), radial-gradient(32rem 32rem at 88% 12%, rgba(168,85,247,.16), transparent 60%), #1d1e20; } }
      main { width:min(34rem, calc(100% - 2rem)); }
      h1 { font-size:1.5rem; margin:0; background:linear-gradient(90deg,#2563eb,#7c3aed); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; width:fit-content; }
      .card { background:var(--card-bg); backdrop-filter:blur(14px) saturate(1.1); -webkit-backdrop-filter:blur(14px) saturate(1.1); border-radius:16px; border:1px solid var(--card-border); box-shadow:var(--shadow); padding:1.5rem 1.9rem; margin-bottom:1rem; }
      p.sub { color:var(--secondary); margin:.4rem 0 0; font-size:.92rem; }
      a.tool { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.9rem 1.1rem; border:1px solid rgba(17,24,39,.12); border-radius:12px; text-decoration:none; color:inherit; background:rgba(255,255,255,.6); transition:transform .15s ease, box-shadow .15s ease; }
      @media (prefers-color-scheme: dark) { a.tool { background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.12); } }
      a.tool:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(79,70,229,.18); }
      a.tool b { color:var(--primary); }
      a.tool span.desc { font-size:.82rem; color:var(--secondary); }
      footer { text-align:center; font-size:.78rem; color:var(--secondary); }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>tdstud1o 工具箱</h1>
        <p class="sub">纯前端小工具，全部本地计算、零后端、零外发请求。</p>
      </div>
      <a class="tool" href="./shamir/">
        <div>
          <b>Shamir 文件分片</b><br />
          <span class="desc">任意文件 → n 个分片 + 1 个密文；凑齐 k 片恢复 · AES-256-GCM</span>
        </div>
        <span>→</span>
      </a>
      <footer>github.com/tdstud1o/tool</footer>
    </main>
  </body>
</html>
